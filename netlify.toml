[build]
  command = "npm ci && npm run build:wallet && python3 scripts/export_site.py"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  PYTHON_VERSION = "3.12"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'none'"

[[redirects]]
  from = "/app/overview"
  to = "/app/overview/"
  status = 301

[[redirects]]
  from = "/app/jobs"
  to = "/app/jobs/"
  status = 301

[[redirects]]
  from = "/app/nodes"
  to = "/app/nodes/"
  status = 301

[[redirects]]
  from = "/app/activity"
  to = "/app/activity/"
  status = 301

[[redirects]]
  from = "/app/settings"
  to = "/app/settings/"
  status = 301
