services:
  api:
    build: .
    restart: unless-stopped
    environment:
      CLINTR_DEMO_TOKEN: ${CLINTR_DEMO_TOKEN:?Set CLINTR_DEMO_TOKEN}
      CLINTR_IPFS_API: http://ipfs:5001
      CLINTR_IPFS_READ_APIS: http://ipfs:5001,http://ipfs1:5001,http://ipfs2:5001
      CLINTR_CLUSTER_API: http://cluster0:9094
      CLINTR_DATABASE_URL: postgresql://clintr@postgres:5432/clintr
      PGPASSWORD: ${CLINTR_POSTGRES_PASSWORD:-local-demo-db-password}
    depends_on:
      cluster0:
        condition: service_started
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 5
  maintenance:
    build: .
    restart: unless-stopped
    environment:
      CLINTR_DATABASE_URL: postgresql://clintr@postgres:5432/clintr
      CLINTR_IPFS_API: http://ipfs:5001
      CLINTR_IPFS_READ_APIS: http://ipfs:5001,http://ipfs1:5001,http://ipfs2:5001
      CLINTR_CLUSTER_API: http://cluster0:9094
      PGPASSWORD: ${CLINTR_POSTGRES_PASSWORD:-local-demo-db-password}
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "clintr.maintenance"]
  worker:
    build: .
    restart: unless-stopped
    environment:
      CLINTR_API_URL: http://api:8000
      CLINTR_DEMO_TOKEN: ${CLINTR_DEMO_TOKEN:?Set CLINTR_DEMO_TOKEN}
      CLINTR_WORKER_NODE: clintr-demo-node
      CLINTR_WORKER_STAKE: 50
      CLINTR_WORKER_METRICS_PORT: 9101
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "clintr.worker_daemon"]
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
  ipfs:
    image: ipfs/kubo:v0.43.1
    restart: unless-stopped
    volumes:
      - ipfs_data:/data/ipfs
    ports:
      - "4001:4001"
      - "4001:4001/udp"
  ipfs1:
    image: ipfs/kubo:v0.43.1
    restart: unless-stopped
    volumes:
      - ipfs1_data:/data/ipfs
  ipfs2:
    image: ipfs/kubo:v0.43.1
    restart: unless-stopped
    volumes:
      - ipfs2_data:/data/ipfs
  cluster0:
    image: ipfs/ipfs-cluster:v1.1.6
    restart: unless-stopped
    depends_on: [ipfs]
    environment:
      CLUSTER_PEERNAME: cluster0
      CLUSTER_SECRET: ${CLINTR_CLUSTER_SECRET:?Set CLINTR_CLUSTER_SECRET to 64 random hex characters}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs/tcp/5001
      CLUSTER_CRDT_TRUSTEDPEERS: '*'
      CLUSTER_RESTAPI_HTTPLISTENMULTIADDRESS: /ip4/0.0.0.0/tcp/9094
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes:
      - cluster0_data:/data/ipfs-cluster
  cluster1:
    image: ipfs/ipfs-cluster:v1.1.6
    restart: unless-stopped
    depends_on: [ipfs1]
    environment:
      CLUSTER_PEERNAME: cluster1
      CLUSTER_SECRET: ${CLINTR_CLUSTER_SECRET:?Set CLINTR_CLUSTER_SECRET to 64 random hex characters}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs1/tcp/5001
      CLUSTER_CRDT_TRUSTEDPEERS: '*'
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes:
      - cluster1_data:/data/ipfs-cluster
  cluster2:
    image: ipfs/ipfs-cluster:v1.1.6
    restart: unless-stopped
    depends_on: [ipfs2]
    environment:
      CLUSTER_PEERNAME: cluster2
      CLUSTER_SECRET: ${CLINTR_CLUSTER_SECRET:?Set CLINTR_CLUSTER_SECRET to 64 random hex characters}
      CLUSTER_IPFSHTTP_NODEMULTIADDRESS: /dns4/ipfs2/tcp/5001
      CLUSTER_CRDT_TRUSTEDPEERS: '*'
      CLUSTER_MONITORPINGINTERVAL: 2s
    volumes:
      - cluster2_data:/data/ipfs-cluster
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clintr
      POSTGRES_USER: clintr
      POSTGRES_PASSWORD: ${CLINTR_POSTGRES_PASSWORD:-local-demo-db-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clintr -d clintr"]
      interval: 5s
      timeout: 3s
      retries: 10
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./ops/grafana-datasource.yml:/etc/grafana/provisioning/datasources/clintr.yml:ro
      - ./ops/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/clintr.yml:ro
      - ./ops/clintr-dashboard.json:/var/lib/grafana/dashboards/clintr.json:ro
volumes:
  ipfs_data:
  ipfs1_data:
  ipfs2_data:
  cluster0_data:
  cluster1_data:
  cluster2_data:
  postgres_data:
