[project]
name = "clintr"
version = "0.1.0"
description = "Clintr deterministic edge compute demo and GenLayer contract"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "prometheus-client>=0.21,<1", "psycopg[binary]>=3.2,<4", "jinja2>=3.1,<4"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clintr"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
contract-test = ["pytest>=8,<9", "genlayer-test==0.29.2", "genvm-linter==0.11.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
